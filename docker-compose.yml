# BEAM Campus — production deployment (beam-campus.net). Mirrors macula-realm-compose.
#
# Pull-only: the image is built by beam-campus-net CI and published to ghcr.io; this
# repo never builds. Deployment is ZERO-TOUCH — a push to beam-campus-net main ships a
# new :latest, and Watchtower (below, running by default) auto-pulls and rolling-
# restarts the site. No ssh, no manual "update" script; the scripts are bootstrap only.
#
# One-time bootstrap on the box:
#   git clone … /opt/beam-campus-net-compose
#   cp .env.example .env && $EDITOR .env      # set SECRET_KEY_BASE
#   docker compose up -d                      # brings up site + caddy + watchtower
#
# Ports: 80/443 (Caddy). The site is not exposed directly. SQLite-backed; Caddy does
# automatic Let's Encrypt.

services:
  site:
    image: ghcr.io/beam-campus/beam-campus-net:${SITE_VERSION:-latest}
    container_name: beam-campus-site
    hostname: site
    restart: unless-stopped
    pull_policy: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      PORT: "4000"
      PHX_HOST: "${PHX_HOST:-beam-campus.net}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}"
      BEAM_CAMPUS_DB_PATH: "/data/beam_campus.db"
      BEAM_CAMPUS_MAILGUN_API_KEY: "${BEAM_CAMPUS_MAILGUN_API_KEY:-}"
      BEAM_CAMPUS_MAILGUN_DOMAIN: "${BEAM_CAMPUS_MAILGUN_DOMAIN:-mg.beam-campus.net}"
      BEAM_CAMPUS_MAILGUN_BASE_URL: "${BEAM_CAMPUS_MAILGUN_BASE_URL:-https://api.eu.mailgun.net}"
      BEAM_CAMPUS_CONTACT_EMAIL: "${BEAM_CAMPUS_CONTACT_EMAIL:-raf.lefever@erlef.org}"
      # Robo Rumble spectator. The site SUBSCRIBES to the rumbler's facts and
      # renders them; it never publishes and holds no store.
      #
      # The realm is defaulted in the app itself and needs no value here: rumble
      # facts ride `net.beamcampus.rumble`, their own realm, precisely so this
      # public container never holds the tag that routes sentinel sightings and
      # warden facts. Set BEAM_CAMPUS_RUMBLE_REALM only to override.
      #
      # SEEDS are what actually turn the spectator on. Unset means the page
      # renders its empty state, which is the correct default for anyone who
      # clones this repo.
      BEAM_CAMPUS_RUMBLE_SEEDS: "${BEAM_CAMPUS_RUMBLE_SEEDS:-https://station-de-frankfurt.macula.io:4433}"
    volumes:
      - site-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: beam-campus-caddy
    hostname: caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-beam-campus.net, www.beam-campus.net}"
      SITE_UPSTREAM: "site:4000"
      ACME_EMAIL: "${ACME_EMAIL:-raf.lefever@erlef.org}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/holding:/srv/holding:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on:
      site:
        condition: service_started

  # Zero-touch deploys, mirroring macula-realm-compose: a new :latest pushed to
  # ghcr (by beam-campus-net CI) is auto-pulled and the site rolling-restarted,
  # no ssh, no manual script. Runs by default (label-enabled, 60s poll).
  #
  # Prerequisite (one-time, box owner): the box must be able to PULL the image.
  # Make the ghcr package PUBLIC (ghcr.io/beam-campus/beam-campus-net → Package
  # settings → Change visibility), or drop a read-only registry PAT into
  # ./docker-config.json on the box and mount it here as macula-realm-compose does.
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: beam-campus-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # watchtower 1.7.1 defaults to Docker API 1.25, which modern daemons reject
      # ("client version too old"). Pin a supported version, as macula-realm-compose does.
      DOCKER_API_VERSION: "1.44"
      TZ: "${TZ:-UTC}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]

networks:
  internal:

volumes:
  site-data:
  caddy-data:
  caddy-config:
