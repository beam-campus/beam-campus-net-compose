# BEAM Campus — production deployment (beam-campus.net). Mirrors macula-realm-compose.
#
# Pull-only: the image is built by beam-campus-net CI and published to ghcr.io; this
# repo never builds. Deployment is ZERO-TOUCH — a push to beam-campus-net main ships a
# new :latest, and Watchtower (below, running by default) auto-pulls and rolling-
# restarts the site. No ssh, no manual "update" script; the scripts are bootstrap only.
#
# One-time bootstrap on the box:
#   git clone … /opt/beam-campus-net-compose
#   cp .env.example .env && $EDITOR .env      # set SECRET_KEY_BASE
#   docker compose up -d                      # brings up site + caddy + watchtower
#
# Ports: 80/443 (Caddy). The site is not exposed directly. SQLite-backed; Caddy does
# automatic Let's Encrypt.

services:
  site:
    image: ghcr.io/beam-campus/beam-campus-net:${SITE_VERSION:-latest}
    container_name: beam-campus-site
    hostname: site
    restart: unless-stopped
    pull_policy: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      PORT: "4000"
      PHX_HOST: "${PHX_HOST:-beam-campus.net}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}"
      BEAM_CAMPUS_DB_PATH: "/data/beam_campus.db"
      BEAM_CAMPUS_MAILGUN_API_KEY: "${BEAM_CAMPUS_MAILGUN_API_KEY:-}"
      BEAM_CAMPUS_MAILGUN_DOMAIN: "${BEAM_CAMPUS_MAILGUN_DOMAIN:-mg.beam-campus.net}"
      BEAM_CAMPUS_MAILGUN_BASE_URL: "${BEAM_CAMPUS_MAILGUN_BASE_URL:-https://api.eu.mailgun.net}"
      BEAM_CAMPUS_CONTACT_EMAIL: "${BEAM_CAMPUS_CONTACT_EMAIL:-raf.lefever@erlef.org}"
      # ⚠ ROBO RUMBLE'S LINE IS GONE BECAUSE ITS PAGE IS. The spectator was
      # removed from the site on 2026-08-05 for regenerating a duel locally from
      # two genomes instead of replaying a recording, which put a game engine
      # inside a content website. A seeds variable for a page that no longer
      # exists dials a production station for nothing. The rumbler SERVICE is
      # still running on beam03; only the page was retired.
      #
      # Biotopes: islands running open populations on the mesh. The site
      # SUBSCRIBES and renders; it never publishes and holds no store.
      #
      # The REALM is defaulted in the app because net.beamcampus.biotope is
      # public by design and its tag is sha256 of that name; the SEEDS are what
      # actually turn the page on. Unset means the page renders its empty state,
      # which is the correct default for anyone who clones this repo.
      #
      # Reading these needs the PUBLIC realm and never the fleet one. A public
      # web container holding the fleet tag could read sentinel sightings and
      # warden facts too, which is the line realms exist to draw.
      BEAM_CAMPUS_BIOTOPE_SEEDS: "${BEAM_CAMPUS_BIOTOPE_SEEDS:-https://station-de-frankfurt.macula.io:4433}"
      #
      # A Society: islands of persons who hold beliefs and decide who may land.
      # Same shape and same reasons again, on net.beamcampus.society.
      #
      # The station is one of the seven the join page lists as answering, and it
      # is deliberately the SAME one the other two spectators default to.
      # Which door this container dials does not decide what it receives:
      # routing is the mesh's job, and the four islands reach the mesh through
      # four different stations of their own.
      BEAM_CAMPUS_SOCIETY_SEEDS: "${BEAM_CAMPUS_SOCIETY_SEEDS:-https://station-de-frankfurt.macula.io:4433}"
      #
      # DroneX: islands breeding airborne drone controllers, on
      # net.beamcampus.dronex. Same shape and same reasons again.
      #
      # ⚠ THIS PAGE REPLAYS A RECORDING AND DOES NOT RE-RUN ANYTHING. That is
      # the whole difference between it and the Robo Rumble page it replaces:
      # an island publishes a finished engagement as frames and the browser
      # animates them, which is why it can scrub, pause and slow down, and why
      # the site cannot show a fight nobody fought.
      #
      # One island today, on beam02, reaching the mesh through Stockholm. This
      # container dials Frankfurt like the other two, because which door it
      # dials does not decide what it receives: routing is the mesh's job.
      BEAM_CAMPUS_DRONEX_SEEDS: "${BEAM_CAMPUS_DRONEX_SEEDS:-https://station-de-frankfurt.macula.io:4433}"
    volumes:
      - site-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: beam-campus-caddy
    hostname: caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-beam-campus.net, www.beam-campus.net}"
      SITE_UPSTREAM: "site:4000"
      ACME_EMAIL: "${ACME_EMAIL:-raf.lefever@erlef.org}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/holding:/srv/holding:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on:
      site:
        condition: service_started

  # Zero-touch deploys, mirroring macula-realm-compose: a new :latest pushed to
  # ghcr (by beam-campus-net CI) is auto-pulled and the site rolling-restarted,
  # no ssh, no manual script. Runs by default (label-enabled, 60s poll).
  #
  # Prerequisite (one-time, box owner): the box must be able to PULL the image.
  # Make the ghcr package PUBLIC (ghcr.io/beam-campus/beam-campus-net → Package
  # settings → Change visibility), or drop a read-only registry PAT into
  # ./docker-config.json on the box and mount it here as macula-realm-compose does.
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: beam-campus-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # watchtower 1.7.1 defaults to Docker API 1.25, which modern daemons reject
      # ("client version too old"). Pin a supported version, as macula-realm-compose does.
      DOCKER_API_VERSION: "1.44"
      TZ: "${TZ:-UTC}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]

networks:
  # IPv6 ON THE BRIDGE, and it is not optional: every macula station resolves
  # AAAA-only (station-de-frankfurt.macula.io has no A record at all). A default
  # Docker bridge is IPv4-only, so the Robo Rumble spectator connected to a pool
  # whose single link never completed a handshake: `healthy_links: 0`,
  # `failed_links: 1`, four subscriptions registered against nothing. Subscribing
  # succeeds locally in the SDK, so nothing raised and the page simply looked
  # quiet.
  #
  # macula-realm-compose solves the same problem twice: `network_mode: host` for
  # the containers that host or sense a station, and this on its shared bridge.
  # Host mode is wrong here because the site sits behind Caddy, so the bridge
  # answer is the one that fits.
  #
  # ULA subnet plus Docker's ip6tables NAT66, which Docker 29 does by default.
  internal:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
        - subnet: fd00:0:0:2::/64

volumes:
  site-data:
  caddy-data:
  caddy-config:
